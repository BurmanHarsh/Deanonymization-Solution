<!DOCTYPE html>

<html>
<head>
	 <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>AIL-Framework</title>
	<link rel="icon" href="{{ url_for('static', filename='image/ail-icon.png')}}">
	<!-- Core CSS -->
	<link href="{{ url_for('static', filename='css/bootstrap4.min.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/font-awesome.min.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/modern-ui.css') }}" rel="stylesheet">

	<!-- JS -->
	<script src="{{ url_for('static', filename='js/jquery.js')}}"></script>
	<script src="{{ url_for('static', filename='js/bootstrap4.min.js')}}"></script>


	<style>
	html,
	body { height: 100%; }
	body {
		display: -ms-flexbox; display: flex;
		-ms-flex-align: center; align-items: center;
		padding-top: 40px; padding-bottom: 40px;
		background:
			radial-gradient(800px 400px at 20% 0%, rgba(168, 85, 247, .4), transparent 60%),
			radial-gradient(700px 350px at 100% 100%, rgba(34, 211, 238, .25), transparent 60%),
			linear-gradient(135deg, #07091a 0%, #14193b 50%, #2a0f4a 100%);
		color: #f1f5ff;
	}
	.form-signin {
		width: 100%; max-width: 380px;
		padding: 2.25rem 2rem;
		margin: auto;
		background: rgba(18, 24, 38, .85);
		border: 1px solid rgba(255, 255, 255, .08);
		border-radius: 18px;
		box-shadow: 0 25px 60px rgba(0, 0, 0, .55);
		backdrop-filter: blur(14px);
		color: #f1f5ff;
	}
	.form-signin .checkbox { font-weight: 400; }
	.form-signin .form-control {
		position: relative; box-sizing: border-box;
		height: auto; padding: 12px 14px; font-size: 15px;
		border-radius: 10px;
		background: #0b0f1a;
		border-color: #2c3858;
		color: #f1f5ff;
	}
	.form-signin .form-control::placeholder { color: #8895b3; }
	.form-signin .form-control:focus {
		z-index: 2;
		background: #121826;
		border-color: #22d3ee;
		box-shadow: 0 0 0 .2rem rgba(34, 211, 238, .25);
	}
	.form-signin input[type="email"] {
		margin-bottom: -1px;
		border-bottom-right-radius: 0; border-bottom-left-radius: 0;
	}
	.form-signin input[type="password"] {
		margin-bottom: 1rem;
		border-top-left-radius: 0; border-top-right-radius: 0;
	}
	</style>

</head>

<body class="text-center ail-auth">


				<form class="form-signin ail-auth-card" action="{{ url_for('root.login')}}"  method="post">
		      <img class="mb-4" src="{{ url_for('static', filename='image/ail-project.png')}}" width="300">
			      <h1 class="h3 mb-3 text-secondary">Welcome back</h1>
		      <label for="inputEmail" class="sr-only">Email address</label>
		      <input type="email" id="inputEmail" name="username" class="form-control" placeholder="Email address" required autofocus>
		      <label for="inputPassword" class="sr-only">Password</label>
		      <input type="password" id="inputPassword" name="password" class="form-control {% if error %}is-invalid{% endif %}" placeholder="Password" required>
					<input type="text" id="next_page" name="next_page" value="{{next_page}}" hidden>
					{% if error %}
						<div class="invalid-feedback">
							{{error}}
						</div>
					{% endif %}
					<button class="btn btn-lg btn-primary btn-block" type="submit">Sign in</button>
		    </form>


</body>
